<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">Same output, different reasoning paths</title><desc id="desc">A hand-drawn diagram: an external plan can precede rendering, or generated visual states can feed later reasoning. Correct output alone does not locate inference.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#d3d7c7"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#345748" stroke-width="1.4"/></marker></defs><rect x="8" y="8" width="624" height="494" rx="18" fill="#fffdf5"/><rect x="8" y="8" width="624" height="494" rx="18" fill="url(#dots)"/><g fill="none" stroke="#345748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 15Q300 7 615 18L625 488Q300 498 18 489Z" opacity=".3"/><path d="M43 95Q149 90 246 97L242 185 39 181Z" fill="#eee5d1"/><path d="M355 98L574 94 580 184 351 188Z" fill="#e2ecdc"/><path d="M253 139Q298 125 338 138" marker-end="url(#arrow)"/><path d="M43 275L202 278 198 368 46 372Z" fill="#e2ecdc"/><path d="M340 275L571 271 576 368 336 372Z" fill="#eee5d1"/><path d="M210 307Q274 282 323 307" marker-end="url(#arrow)"/><path d="M339 348Q270 410 204 354" marker-end="url(#arrow)"/><path d="M72 342L72 305 118 305 119 342Z"/><path d="M81 330L91 318 103 331 111 323"/><path d="M131 342L131 306 176 305 176 343Z"/><path d="M139 330L153 316 168 330"/><path d="M170 441Q311 450 487 439" stroke="#c3683c" stroke-width="5" opacity=".3"/></g><g font-family="Georgia,serif" fill="#233d37"><text x="43" y="60" font-size="22" font-style="italic">Where does the inference happen?</text><text x="65" y="129" font-size="21">An external plan</text><text x="65" y="157" font-family="sans-serif" font-size="12" fill="#626c65">rules · trajectories · simulation</text><text x="381" y="133" font-size="23">Render the result</text><text x="382" y="160" font-family="sans-serif" font-size="12" fill="#626c65">the solution is already specified</text><text x="45" y="245" font-size="18" font-style="italic" fill="#c3683c">Or: use visual states along the way</text><text x="67" y="294" font-family="sans-serif" font-size="11">GENERATED STATES</text><text x="363" y="312" font-size="23">Reason / update</text><text x="363" y="340" font-family="sans-serif" font-size="12" fill="#626c65">read the state → decide what is next</text><text x="224" y="274" font-family="sans-serif" font-size="11" fill="#626c65">visual feedback</text><text x="243" y="394" font-family="sans-serif" font-size="11" fill="#626c65">generate again</text><text x="118" y="441" font-size="23" font-style="italic">Correct output ≠ reasoning attribution</text><text x="119" y="471" font-family="sans-serif" font-size="12" fill="#626c65">Intervene on the process, not just inspect the result.</text></g></svg>